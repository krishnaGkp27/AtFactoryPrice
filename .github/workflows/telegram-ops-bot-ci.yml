name: telegram-ops-bot CI

# Runs the offline test gates for the Telegram ops bot on every push / PR that
# touches telegram-ops-bot/. All three gates run with ZERO credentials — the
# suites mock Telegram, Google Sheets and OpenAI — so no secrets are required.
on:
  push:
    paths:
      - 'telegram-ops-bot/**'
      - '.github/workflows/telegram-ops-bot-ci.yml'
  pull_request:
    paths:
      - 'telegram-ops-bot/**'
      - '.github/workflows/telegram-ops-bot-ci.yml'

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: tgbot-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # Test BOTH the runtime we deploy and the one ahead of it. The Dockerfile
    # (and therefore Railway) runs node:20-alpine, so 20 is what production
    # actually executes; 22 stays in the matrix so an upgrade never lands as a
    # surprise. Previously CI ran 22 only, i.e. it never tested the shipped
    # runtime.
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20', '22']
    defaults:
      run:
        working-directory: telegram-ops-bot
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The built-in test runner's glob handling is version-sensitive, so the
      # matrix pins exact majors rather than relying on engines (>=20).
      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: telegram-ops-bot/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Blocking: any ESLint *error* (real-bug rules) fails the build.
      # Hygiene findings are warnings and do not fail CI.
      - name: Lint (ESLint — errors only block)
        run: npm run lint

      - name: Unit + characterization tests (node:test)
        run: npm test

      - name: Offline smoke harness
        run: npm run smoke

      - name: Org-graph assertions
        run: npm run check-org
