name: telegram-ops-bot CI

# Runs the offline test gates for the Telegram ops bot on every push / PR that
# touches telegram-ops-bot/. All three gates run with ZERO credentials — the
# suites mock Telegram, Google Sheets and OpenAI — so no secrets are required.
on:
  push:
    paths:
      - 'telegram-ops-bot/**'
      - '.github/workflows/telegram-ops-bot-ci.yml'
  pull_request:
    paths:
      - 'telegram-ops-bot/**'
      - '.github/workflows/telegram-ops-bot-ci.yml'

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: tgbot-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # KNOWN GAP (25-Jul-2026): the Dockerfile — and therefore Railway — runs
    # node:20-alpine, but the suite CANNOT run on Node 20: the `test` script
    # passes a glob ("test/**/*.test.js") and the built-in runner only expands
    # globs from Node 21. The obvious workaround (`node --test test`) is not a
    # drop-in either — the runner then treats every helper under test/ as a
    # test file and fails. A Node 20 matrix leg was tried and went red for
    # exactly this reason.
    #
    # So CI deliberately runs 22 only, and this comment is the honest record
    # that the SHIPPED runtime is not the tested one. Closing the gap is a
    # deliberate change, not a CI tweak: either bump the Dockerfile to node:22
    # (aligns everything up; needs a deploy + smoke on Railway) or make the
    # test script glob-free with an explicit file list.
    defaults:
      run:
        working-directory: telegram-ops-bot
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pinned major: the built-in runner's glob handling is version-sensitive
      # (see the note above), so this must stay >= 21.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: telegram-ops-bot/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Blocking: any ESLint *error* (real-bug rules) fails the build.
      # Hygiene findings are warnings and do not fail CI.
      - name: Lint (ESLint — errors only block)
        run: npm run lint

      - name: Unit + characterization tests (node:test)
        run: npm test

      - name: Offline smoke harness
        run: npm run smoke

      - name: Org-graph assertions
        run: npm run check-org
