<!doctype html><html><head><meta charset="utf-8"><title>Ledger header</title><style>
body{margin:0;padding:24px;background:#0d0d0f;color:#f2f2f2;font:15px/1.5 Inter,'Segoe UI',Arial,sans-serif}
h1{font-size:22px;letter-spacing:2px;margin:0 0 2px}
h1 .accent{color:#d4af5f}
.sub{color:#9a9a9a;font-size:12px;letter-spacing:1px;text-transform:uppercase;margin-bottom:14px}
.net{margin-top:6px;font-size:16px}
.net b{color:#d4af5f}
.strip{display:flex;gap:22px;margin-top:14px;padding:12px 16px;background:#121215;border:1px solid #2c2c33;max-width:560px}
.strip div{font-size:12px;color:#9a9a9a}
.strip b{display:block;font-size:17px;color:#f2f2f2;font-variant-numeric:tabular-nums}
.strip .gold b{color:#d4af5f}
</style></head><body>
<h1>AT<span class="accent">FACTORY</span>PRICE</h1>
<div class="sub">Supply ledger — Owaibula</div>
<div class="net">Net position: <b>24 thans</b> supplied on the books</div>
<div class="strip">
  <div>Supplied<b>4B + 26t</b></div>
  <div>Returned<b>4t</b></div>
  <div class="gold">Outstanding<b>₦1,250,000</b></div>
</div>
</body></html>
