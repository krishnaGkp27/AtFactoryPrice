<!doctype html><html><head><meta charset="utf-8"><title>Buttons</title><style>
body{margin:0;padding:24px;background:#FAFAF7;font-family:Inter,system-ui,sans-serif}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:500 15px/1 Inter;height:44px;padding:0 22px;border-radius:999px;border:1px solid transparent;cursor:pointer}
</style></head><body>
<div class="row">
<button class="btn" style="background:#0A0A0B;color:#fff">Primary</button>
<button class="btn" style="background:#D8262C;color:#fff">Brand</button>
<button class="btn" style="background:transparent;color:#0A0A0B;border-color:#0A0A0B">Secondary</button>
<button class="btn" style="background:transparent;color:#0A0A0B">Ghost</button>
<button class="btn" style="background:#0A0A0B;color:#fff;opacity:.4">Disabled</button>
</div>
</body></html>
