<!doctype html><html><head><meta charset="utf-8"><title>Status pills</title><style>
body{margin:0;padding:24px;background:#FAFAF7;font:14px/1.5 Inter,system-ui,sans-serif;color:#0A0A0B}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.pill{display:inline-flex;align-items:center;gap:6px;font:600 12px/1 Inter;padding:6px 12px;border-radius:999px}
h2{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#56565A;margin:0 0 8px}
.dark{background:#0d0d0f;padding:16px;border-radius:8px;margin-top:4px}
</style></head><body>
<h2>Site family</h2>
<div class="row">
<span class="pill" style="background:#E4F2EB;color:#1F7A4D">PAID</span>
<span class="pill" style="background:#FBF3E0;color:#B8860B">PART-PAID</span>
<span class="pill" style="background:#F5DEDF;color:#A8161B">UNPAID</span>
<span class="pill" style="background:#F8E5E6;color:#B81E23">⚠ LARGE PAYMENT</span>
</div>
<h2>Ledger family (on dark)</h2>
<div class="dark"><div class="row" style="margin:0">
<span class="pill" style="background:#17281c;color:#8fd18f">SUPPLY</span>
<span class="pill" style="background:#281c17;color:#e0a878">RETURN</span>
<span class="pill" style="background:#1c1c22;color:#d4af5f">BALANCE</span>
<span class="pill" style="background:#16202b;color:#7fb8ff">SALE DOC ×2</span>
</div></div>
</body></html>
