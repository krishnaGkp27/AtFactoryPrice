<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Design — AtFactoryPrice</title>
  <!-- SHR-1 — tracked share landing (/d/<token> rewrites here; see
       telegram-ops-bot/specs/SHR-1_SHARE_TRACKING.md). Self-contained on
       purpose: it must load instantly on any phone from a WhatsApp tap. -->
  <style>
    * { box-sizing: border-box; margin: 0; }
    body { font-family: -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; background: #f2f2f0; color: #222; }
    .sheet { max-width: 560px; margin: 0 auto; background: #fff; min-height: 100vh; display: flex; flex-direction: column; }
    header { background: #171717; color: #fff; padding: 18px 24px; }
    header h1 { font-size: 18px; } header h1 span { color: #c9a227; }
    .photo { width: 100%; display: block; background: #eee; min-height: 200px; object-fit: contain; }
    main { padding: 16px 24px 28px; }
    .shades { color: #666; font-size: 13px; margin-bottom: 16px; }
    .btn { display: block; text-align: center; padding: 13px; border-radius: 6px; font-size: 15px; font-weight: 600;
           text-decoration: none; border: 0; width: 100%; cursor: pointer; margin-top: 10px; font-family: inherit; }
    .share { background: #171717; color: #fff; }
    .dl { background: #fff; color: #171717; border: 2px solid #171717; }
    .browse { background: #c9a227; color: #171717; }
    .note { margin-top: 14px; font-size: 11.5px; color: #999; text-align: center; }
    .state { padding: 40px 24px; text-align: center; color: #666; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
<div class="sheet">
  <header><h1 id="title">AtFactoryPrice <span>— Catalogue</span></h1></header>
  <div id="loading" class="state">Loading design…</div>
  <div id="error" class="state" hidden>This link isn’t available right now.<br>Please ask for a fresh one.</div>
  <img id="photo" class="photo" alt="Design" hidden>
  <main id="actions" hidden>
    <p class="shades" id="shades"></p>
    <button class="btn share" id="shareBtn">📤 Share this design</button>
    <button class="btn dl" id="dlBtn">⬇ Download picture</button>
    <a class="btn browse" href="/products">🛍 Browse all products</a>
    <p class="note">Shared from AtFactoryPrice</p>
  </main>
</div>
<!-- Absolute path: the page is served at /d/<token>, where a relative
     src would resolve to /d/js/… and hit the rewrite instead of the file. -->
<script src="/js/site-config.js"></script>
<script>
  (function () {
    var $ = function (id) { return document.getElementById(id); };
    var token = (location.pathname.match(/\/d\/([A-Za-z0-9_\-.]+)/) || [])[1] || '';
    var base = (window.AFP_CONFIG && window.AFP_CONFIG.botApiBase || '').replace(/\/+$/, '');
    var design = '';

    function fail() { $('loading').hidden = true; $('error').hidden = false; }
    function beacon(type) {
      try { fetch(base + '/api/share/e/' + token + '?type=' + type, { keepalive: true, mode: 'no-cors' }); } catch (e) {}
    }

    if (!token || !base) { fail(); return; }

    fetch(base + '/api/share/resolve/' + token)
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (data) {
        if (!data.ok) throw new Error('bad token');
        design = data.design;
        document.title = 'Design ' + design + ' — AtFactoryPrice';
        $('title').innerHTML = '';
        $('title').appendChild(document.createTextNode('Design ' + design + ' '));
        var span = document.createElement('span');
        span.textContent = '— AtFactoryPrice';
        $('title').appendChild(span);
        if (data.shades && data.shades.length) {
          $('shades').textContent = 'Shades (' + data.shadeCount + '): ' + data.shades.join(', ');
        }
        $('photo').src = base + data.imagePath;
        $('photo').hidden = false;
        $('actions').hidden = false;
        $('loading').hidden = true;
      })
      .catch(fail);

    $('shareBtn').onclick = function () {
      beacon('share');
      var url = location.href;
      if (navigator.share) {
        navigator.share({ title: 'Design ' + design, text: 'Design ' + design + ' — AtFactoryPrice', url: url })['catch'](function () {});
      } else {
        window.open('https://wa.me/?text=' + encodeURIComponent('Design ' + design + ' — ' + url), '_blank');
      }
    };

    $('dlBtn').onclick = function () {
      beacon('download');
      fetch(base + '/api/share/img/' + token)
        .then(function (r) { return r.blob(); })
        .then(function (b) {
          var a = document.createElement('a');
          a.href = URL.createObjectURL(b);
          a.download = 'design-' + design + '.jpg';
          document.body.appendChild(a); a.click(); a.remove();
        })
        ['catch'](function () { location.href = base + '/api/share/img/' + token; });
    };
  })();
</script>
</body>
</html>
